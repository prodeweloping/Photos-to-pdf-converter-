<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo to PDF · Pro Developing</title>
  <link rel="icon" type="image/png" href="Pro.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind + FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Font: Inter (bold & clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{ --footer-height: 70px; }

    body{
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg,#f5f7fa,#c3cfe2);
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ✅ NEW NAVBAR (blue+orange logo + whatsapp) */
    .new-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.02);
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-blue {
      color: #007BFF;
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
    }
    .logo-orange {
      color: #FF6F00;
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
    }
    .whatsapp-nav {
      background-color: #25D366;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      box-shadow: 0 6px 12px rgba(37,211,102,0.2);
      text-decoration: none;
    }
    .whatsapp-nav:hover {
      transform: scale(1.12);
      box-shadow: 0 10px 18px rgba(37,211,102,0.35);
    }

    /* MAIN AREA */
    .main-container{
      max-width:900px;
      margin:0 auto;
      padding: 100px 16px calc(var(--footer-height) + 24px);
      flex:1;
    }

    /* Floating WhatsApp */
    .whatsapp-float {
      background-color: #25D366;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 2rem; box-shadow: 0 8px 20px rgba(37,211,102,0.3);
      transition: transform 0.2s;
      text-decoration: none;
    }
    .whatsapp-float:hover { transform: scale(1.1); }
    @keyframes beat{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
    .beat{ animation:beat 2s infinite; }

    /* CONVERTER UI */
    .container{
      background:#fff;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      overflow:hidden;
    }
    header{
      background:linear-gradient(to right,#4a6fa5,#6d9dc5);
      color:#fff;
      padding:28px;
      text-align:center;
    }
    .upload-area{
      border:3px dashed #c3cfe2;
      padding:40px;
      text-align:center;
      border-radius:12px;
      cursor:pointer;
      background:#f8fafd;
      transition:.3s;
    }
    .upload-area:hover{ border-color:#4a6fa5; }
    .image-preview{ display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
    .preview-item{ width:130px;height:130px; position:relative; }
    .preview-item img{ width:100%;height:100%;object-fit:cover;border-radius:8px; }
    .remove-btn{
      position:absolute;top:4px;right:4px;
      background:red;color:#fff;
      border:none;border-radius:50%;
      width:22px;height:22px;font-size:12px;
    }

    /* ✅ GRADIENT BUTTON (replaces old green) */
    .btn-gradient {
      display: inline-block;
      background: linear-gradient(145deg, #007BFF, #FF6F00);
      background-size: 150% auto;
      color: white;
      padding: 10px 24px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 8px 18px rgba(0, 123, 255, 0.25);
      transition: all 0.3s ease;
      text-align: center;
    }
    .btn-gradient:hover {
      background-position: right center;
      transform: translateY(-4px);
      box-shadow: 0 16px 26px rgba(255, 111, 0, 0.3);
    }

    /* ✅ FOOTER: fixed, exactly "Design by Pro Developing" with yellow link */
    footer.fixed-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--footer-height);
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 0 16px;
      box-shadow: 0 -4px 20px rgba(2,6,23,0.12);
    }
    .design-footer {
      color: #94a3b8;
      font-size: 1rem;
      font-weight: 400;
    }
    .design-footer .yellow-link {
      color: #fbbf24;
      font-weight: 700;
      text-decoration: none;
    }
    .design-footer .yellow-link:hover {
      text-decoration: underline;
    }

    @media(max-width:768px){
      footer.fixed-footer{ position:fixed; }
    }
  </style>
</head>

<body>

<!-- ✅ NEW NAVBAR (Pro blue + Developing orange) with WhatsApp icon -->
<nav class="new-nav">
  <div class="flex items-center">
    <span class="logo-blue">Pro</span>
    <span class="logo-orange">Developing</span>
  </div>
  <a id="waTop" class="whatsapp-nav beat" href="#" title="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
</nav>

<!-- MAIN CONTENT -->
<div class="main-container">

  <div class="container">
    <header>
      <h1 class="text-2xl font-bold">
        <i class="fas fa-file-pdf"></i> Photo to PDF Converter
      </h1>
      <p>Convert images to PDF instantly</p>
    </header>

    <div class="p-6">
      <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt text-4xl text-blue-500"></i>
        <p class="mt-3">Click or Drag images here</p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>

      <div id="imagePreview" class="image-preview"></div>

      <div class="flex gap-3 justify-center mt-6 flex-wrap">
        <!-- ✅ GRADIENT BUTTON for Convert PDF -->
        <button id="convertBtn" class="btn-gradient">
          Convert PDF
        </button>
        <button id="downloadBtn" disabled class="bg-gray-600 text-white px-6 py-2 rounded-full font-semibold opacity-70 cursor-not-allowed">
          Download
        </button>
        <button id="resetBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-semibold transition">
          Reset
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ✅ NEW FOOTER: "Design by Pro Developing" with yellow link to prodeveloping.online -->
<footer class="fixed-footer">
  <div class="design-footer">
    Design by <a href="https://www.prodeveloping.online/" target="_blank" class="yellow-link">Pro Developing</a>
  </div>
</footer>

<!-- Floating WhatsApp (bottom-right, matches navbar style) -->
<a id="waFloating" class="whatsapp-float beat"
   style="position:fixed;right:16px;bottom:calc(var(--footer-height) + 16px);z-index:45;" title="Chat on WhatsApp">
  <i class="fa-brands fa-whatsapp fa-2x"></i>
</a>

<script>
// WhatsApp setup
const waNumber="916356952788";
const waMessage = encodeURIComponent('Hello! I am using your Photo to PDF Converter 😊');
document.querySelectorAll('#waTop,#waFloating').forEach(btn=>{
  btn.onclick=e=>{
    e.preventDefault();
    window.open(`https://wa.me/${waNumber}?text=${waMessage}`, '_blank');
  }
});

// Image to PDF logic (unchanged, only UI updated)
const fileInput=document.getElementById('fileInput');
const uploadArea=document.getElementById('uploadArea');
const imagePreview=document.getElementById('imagePreview');
const convertBtn=document.getElementById('convertBtn');
const downloadBtn=document.getElementById('downloadBtn');
const resetBtn=document.getElementById('resetBtn');
let images=[], pdfUrl=null;

uploadArea.onclick=()=>fileInput.click();
fileInput.onchange=e=>handleFiles(e.target.files);

function handleFiles(files){
  for(let f of files){
    const r=new FileReader();
    r.onload=e=>{
      images.push(e.target.result);
      render();
    };
    r.readAsDataURL(f);
  }
}

function render(){
  imagePreview.innerHTML='';
  images.forEach((img,i)=>{
    imagePreview.innerHTML+=`
      <div class="preview-item">
        <img src="${img}">
        <button class="remove-btn" onclick="removeImg(${i})">×</button>
      </div>`;
  });
}

function removeImg(i){ images.splice(i,1); render(); }

convertBtn.onclick=async()=>{
  if(!images.length) return alert("Upload images first");
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();
  for(let i=0;i<images.length;i++){
    const img=new Image();
    img.src=images[i];
    await new Promise(r=>img.onload=r);
    pdf.addImage(img,'JPEG',10,10,190,0);
    if(i<images.length-1) pdf.addPage();
  }
  pdfUrl=pdf.output('datauristring');
  downloadBtn.disabled=false;
  downloadBtn.classList.remove('bg-gray-600', 'opacity-70', 'cursor-not-allowed');
  downloadBtn.classList.add('bg-orange-500', 'hover:bg-orange-600');
};

downloadBtn.onclick=()=>{
  const a=document.createElement('a');
  a.href=pdfUrl;
  a.download="images.pdf";
  a.click();
};

resetBtn.onclick=()=>{
  images=[]; pdfUrl=null;
  render(); downloadBtn.disabled=true;
  downloadBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
  downloadBtn.classList.add('bg-gray-600', 'opacity-70', 'cursor-not-allowed');
};
</script>

</body>
</html>
